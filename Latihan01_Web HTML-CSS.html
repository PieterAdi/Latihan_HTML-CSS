<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Web01</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        table {
            width: 650px;
            border-collapse: collapse;
        }

        td {
            border: 1px solid #d9a62e;
        }

        /* HEADER */
        .header {
            height: 70px;
            background-color: #ffe6c7;
            text-align: center;
            vertical-align: middle;
        }

        /* NAVIGASI */
        .nav {
            height: 48px;
            background-color: #d9e7fa;
            text-align: center;
            vertical-align: middle;
        }

        /* BAGIAN UTAMA */
        .content {
            height: 275px;
        }

        /* MAIN */
        main {
            background-color: #f7cccc;
            padding: 45px 50px;
            height: 185px;
        }

        main h1 {
            margin-top: 10px;
            font-size: 30px;
        }

        main p {
            width: 350px;
            line-height: 1.2;
        }

        /* ASIDE */
        aside {
            background-color: #d8ead3;
            padding: 40px 10px;
            height: 195px;
            vertical-align: top;
        }

        aside ul {
            margin-top: 10px;
            padding-left: 50px;
        }

        /* FOOTER */
        .footer {
            height: 48px;
            background-color: #ffe6c7;
            text-align: center;
            vertical-align: middle;
        }
    </style>
</head>

<body>

    <table>
        <!-- HEADER -->
        <tr>
            <td colspan="2" class="header">
                <header>
                    HEADER
                </header>
            </td>
        </tr>

        <!-- NAVIGASI -->
        <tr>
            <td colspan="2" class="nav">
                <nav>
                    NAVIGASI
                </nav>
            </td>
        </tr>

        <!-- MAIN + ASIDE -->
        <tr class="content">

            <!-- MAIN -->
            <td width="500">
                <main>
                    <h1>Heading 1</h1>

                    <p>
                        Lorem ipsum dolor sit amet, consectetur
                        adipiscing elit, sed do eiusmod tempor
                        incididunt ut labore et dolore magna aliqua.
                    </p>
                </main>
            </td>

            <!-- ASIDE -->
            <td width="150">
                <aside>
                    <strong>Menu:</strong>

                    <ul>
                        <li>Home</li>
                        <li>Berita</li>
                        <li>Layanan</li>
                        <li>Kontak</li>
                    </ul>
                </aside>
            </td>

        </tr>

        <!-- FOOTER -->
        <tr>
            <td colspan="2" class="footer">
                <footer>
                    FOOTER
                </footer>
            </td>
        </tr>
    </table>

</body>
</html>
